<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>면접 예상질문 노트</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="interview_qna_style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">✎</span>
          <div>
            <h1>면접 예상질문 노트</h1>
            <p class="subtitle">질문을 등록하고, 필요할 때만 답을 펼쳐보세요</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="toggleAllBtn" class="btn btn-ghost" hidden>
            전체 보기
          </button>
          <button
            id="themeBtn"
            class="btn btn-icon"
            aria-label="다크 모드 전환"
          >
            🌙
          </button>
          <button id="importBtn" class="btn btn-ghost">📥 가져오기</button>
          <button id="addBtn" class="btn btn-primary">+ 질문 추가</button>
        </div>
      </header>

      <div class="tabs" role="tablist">
        <button
          class="tab-btn active"
          data-cat="common"
          role="tab"
          aria-selected="true"
        >
          공통질문 <span class="tab-count" id="commonCount">0</span>
        </button>
        <button
          class="tab-btn"
          data-cat="major"
          role="tab"
          aria-selected="false"
        >
          전공질문 <span class="tab-count" id="majorCount">0</span>
        </button>
        <button
          class="tab-btn"
          data-cat="keywords"
          role="tab"
          aria-selected="false"
        >
          키워드 <span class="tab-count" id="keywordTabCount">0</span>
        </button>
      </div>

      <div class="meta-row">
        <span id="countLabel">총 0개 질문</span>
        <span class="storage-note">이 브라우저에만 저장돼요</span>
      </div>

      <main id="list" class="list"></main>

      <div id="emptyState" class="empty-state">
        <p>아직 등록된 질문이 없어요. 첫 질문을 추가해보세요.</p>
        <button id="emptyAddBtn" class="btn btn-primary">
          첫 질문 추가하기
        </button>
      </div>
    </div>

    <div id="modalOverlay" class="modal-overlay" hidden>
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <h2 id="modalTitle">질문 추가</h2>
        <label id="catField"
          >구분
          <select id="catInput">
            <option value="common">공통질문</option>
            <option value="major">전공질문</option>
          </select>
        </label>
        <label
          >질문
          <textarea
            id="qInput"
            rows="3"
            placeholder="예: RESTful API의 특징을 설명해보세요"
          ></textarea>
        </label>
        <label
          >답변
          <textarea
            id="aInput"
            rows="7"
            placeholder="답변을 작성하세요"
          ></textarea>
        </label>
        <label
          >핵심 키워드 <span class="field-hint">(선택, 쉼표로 구분)</span>
          <input
            type="text"
            id="keywordsInput"
            placeholder="예: 인증, 토큰, 세션"
          />
        </label>
        <div class="modal-actions">
          <button id="cancelBtn" class="btn btn-ghost">취소</button>
          <button id="saveBtn" class="btn btn-primary">저장</button>
        </div>
      </div>
    </div>
    <div id="importOverlay" class="modal-overlay" hidden>
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="importTitle"
      >
        <h2 id="importTitle">여러 질문 한 번에 가져오기</h2>
        <p class="import-help">
          마크다운 표( | 번호 | 질문 | 키워드 | ), 탭으로 구분된 목록, 또는
          "질문 :: 키워드1, 키워드2" 형식의 텍스트를 붙여넣으면 자동으로 여러
          질문을 인식해요. 가져온 항목은 답변이 비어 있는 상태로 등록되니,
          나중에 수정(✎)에서 답변을 채워주세요.
        </p>
        <label
          >구분 (가져온 항목이 들어갈 탭)
          <select id="importCatInput">
            <option value="common">공통질문</option>
            <option value="major">전공질문</option>
          </select>
        </label>
        <label
          >붙여넣기
          <textarea
            id="importInput"
            class="import-textarea"
            rows="10"
            placeholder="여기에 표나 목록을 붙여넣으세요"
          ></textarea>
        </label>
        <p class="import-preview" id="importPreview">0개 항목 인식됨</p>
        <div class="modal-actions">
          <button id="importCancelBtn" class="btn btn-ghost">취소</button>
          <button id="importConfirmBtn" class="btn btn-primary">
            가져오기
          </button>
        </div>
      </div>
    </div>

    <script src="interview_qna_script.js"></script>
  </body>
</html>
